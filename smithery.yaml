# Smithery Registry: HiveSwap MCP Server

startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
    required: []
  url: https://mcp-swap.thehiveryiq.com/mcp

name: hiveswap-mcp
displayName: HiveSwap Read-Only Quotes
version: "2.2.0"
description: >
  Read-only Paraswap price quotes on Base. Responses identify the venues returned by
  Paraswap. Hive does not construct, sign, submit, or settle transactions, collect
  routing fees, operate liquidity, or custody funds.

author:
  name: Steve Rotzin
  email: steve@thehiveryiq.com
  url: https://www.thehiveryiq.com

license: MIT
homepage: https://www.thehiveryiq.com
repository:
  type: git
  url: https://github.com/srotzin/hive-mcp-swap

transport: streamable-http
endpoint: https://mcp-swap.thehiveryiq.com/mcp
protocol: "2024-11-05"

categories:
  - agent-to-agent
  - web3
  - developer-tools

tags:
  - mcp
  - hive
  - swap
  - read-only
  - dex-aggregator
  - paraswap
  - base-l2
  - ai-agents

runtime:
  type: node
  version: ">=18"
  command: node server.js
  env:
    - name: PORT
      default: "3000"
      required: false
